name: Test & Build Package

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["lts/*"]
    name: Test on node@v${{ matrix.node }}
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
      - name: Setup pnpm 🔧
        uses: pnpm/action-setup@v4
      - name: Setup node 🔧
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: "pnpm"
      - name: Install 🪄
        run: pnpm install --frozen-lockfile
      # `pod install` rewrites REACT_NATIVE_PATH to the resolved pnpm store
      # realpath, which embeds a content hash of the whole peer set and breaks
      # on any dependency change. Checked here, against the committed file,
      # rather than after a pod install that would legitimately rewrite it.
      - name: No machine-specific paths committed 🔍
        run: |
          if grep -n '/\.pnpm/' example/ios/RNSwiftUIExample.xcodeproj/project.pbxproj; then
            echo "::error::project.pbxproj contains an absolute pnpm store path. Restore the portable \${PODS_ROOT}/../../node_modules/react-native form."
            exit 1
          fi
      - name: Lint 🔍
        run: pnpm run lint
      - name: Format 🔍
        run: pnpm run format:check
      - name: TypeScript 🔍
        run: pnpm run check
      - name: Jest 🔍
        run: pnpm run spec
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["lts/*"]
    name: Build on node@v${{ matrix.node }}
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
      - name: Setup pnpm 🔧
        uses: pnpm/action-setup@v4
      - name: Setup node 🔧
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: "pnpm"
      - name: Install 🪄
        run: pnpm install --frozen-lockfile
      - name: Build 💎
        run: pnpm run build
      # `nitrogen/generated` is checked in, so a stale commit silently ships a
      # bridge that no longer matches `src/specs`. The build above already
      # regenerates it; this just fails when the result differs.
      - name: Nitrogen drift 🔍
        run: git diff --exit-code -- nitrogen/

  ios:
    runs-on: macos-latest
    name: Build example app (iOS)
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
      - name: Setup pnpm 🔧
        uses: pnpm/action-setup@v4
      - name: Setup node 🔧
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          check-latest: true
          cache: "pnpm"
      # The library must be installed (and built, via `prepare`) first: the
      # example depends on it through `link:..`.
      - name: Install library 🪄
        run: pnpm install --frozen-lockfile
      - name: Install example 🪄
        run: pnpm install --frozen-lockfile
        working-directory: example
      # Uses the runner's preinstalled CocoaPods rather than `bundle exec`:
      # example/Gemfile pins xcodeproj < 1.26.0 and concurrent-ruby < 1.3.4,
      # which no longer resolve against current Ruby.
      - name: Pod install 🪄
        run: pod install
        working-directory: example/ios
      - name: Build 💎
        working-directory: example/ios
        run: |
          xcodebuild build \
            -workspace RNSwiftUIExample.xcworkspace \
            -scheme RNSwiftUIExample \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
